<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#23060f" />
    <meta
      name="description"
      content="Tenho um convite para ti ❤️ — Sábado, 03 de Outubro, a partir das 12h."
    />
    <title>Tenho um convite para ti ❤️</title>
  </head>
  <body>
    <form
      name="convite-aceite"
      method="POST"
      action="/"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="convite-aceite" />
      <input
        type="hidden"
        name="evento"
        value="O convite foi aceito pela pessoa que o recebeu."
      />
      <p hidden>
        <label>
          Não preencher: <input name="bot-field" />
        </label>
      </p>
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
